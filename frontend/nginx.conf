# Used only by the "prod" Docker image target (frontend-prod Compose service).
# Serves the static `pnpm build` output and proxies /api + /healthz to the
# backend container, mirroring what the Vite dev server's proxy does in dev
# and what a real reverse proxy/edge function would do in production.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
    }

    location /healthz {
        proxy_pass http://backend:8000/healthz;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
